version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: backend.Dockerfile
    container_name: mahjong-backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./tw_data:/app/tw_data
      - ./core:/app/core
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: mahjong-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
